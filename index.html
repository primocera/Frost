<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Frost</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #080e18;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    canvas { display: block; touch-action: none; }

    /* ── Landing page ─────────────────────────────────────────── */
    #landing {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(170deg, #040d1e 0%, #071a3a 28%, #0a2d5e 58%, #0e4a80 82%, #1a6a9a 100%);
      z-index: 100;
      transition: opacity 0.6s ease;
    }
    #landing.fade-out { opacity: 0; pointer-events: none; }

    /* Stars */
    #landing::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 34% 8%,  rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 56% 22%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 22% 42%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 66% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 72%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 8%  85%, rgba(255,255,255,0.4) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Content wrapper */
    .landing-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      padding: 0 24px;
      position: relative;
    }

    /* Icon */
    .icon-wrap {
      position: relative;
      margin-bottom: 28px;
    }
    .app-icon {
      width: 108px;
      height: 108px;
      background: linear-gradient(145deg, #1a7fc4 0%, #0d4a8a 60%, #09305e 100%);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      box-shadow:
        0 8px 40px rgba(30, 140, 255, 0.35),
        0 0 80px rgba(30, 140, 255, 0.12),
        inset 0 1px 0 rgba(255,255,255,0.15);
      position: relative;
      z-index: 1;
    }

    /* Sparkle dots */
    .spark {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: sparkle 2.4s ease-in-out infinite;
    }
    .spark.s1 { width: 6px; height: 6px; top: -4px;  right: 14px; animation-delay: 0s; }
    .spark.s2 { width: 4px; height: 4px; top: 14px;  right: -6px; animation-delay: 0.6s; }
    .spark.s3 { width: 5px; height: 5px; bottom: 8px; left: -8px;  animation-delay: 1.2s; }
    .spark.s4 { width: 3px; height: 3px; bottom: -2px; right: 26px; animation-delay: 1.8s; }
    @keyframes sparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }

    /* Title */
    .app-title {
      font-size: 46px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 10px;
      text-shadow: 0 0 40px rgba(80, 180, 255, 0.7), 0 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 6px;
    }
    .app-sub {
      font-size: 15px;
      color: rgba(160, 210, 255, 0.65);
      letter-spacing: 1px;
      margin-bottom: 44px;
    }

    /* Name input */
    #name-input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(80, 170, 255, 0.25);
      border-radius: 16px;
      color: #ffffff;
      font-size: 17px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.5px;
    }
    #name-input::placeholder { color: rgba(120, 180, 255, 0.4); }
    #name-input:focus {
      border-color: rgba(80, 170, 255, 0.65);
      background: rgba(255, 255, 255, 0.11);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s;
      letter-spacing: 0.3px;
    }
    .btn:active { transform: scale(0.97); }

    #btn-start {
      background: linear-gradient(135deg, #1460b0, #0a3a78);
      color: #ffffff;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(20, 90, 200, 0.4);
    }
    #btn-start:hover {
      box-shadow: 0 6px 28px rgba(20, 90, 200, 0.55);
      transform: translateY(-1px);
    }

    #btn-guest {
      background: rgba(255, 255, 255, 0.07);
      color: rgba(160, 210, 255, 0.85);
      border: 1.5px solid rgba(80, 160, 255, 0.2);
    }
    #btn-guest:hover { background: rgba(255, 255, 255, 0.12); }

    /* Joystick selector */
    .joy-section {
      width: 100%;
      margin-bottom: 16px;
    }
    .joy-label {
      font-size: 12px;
      color: rgba(120, 180, 255, 0.5);
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }
    .joy-toggle {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .joy-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1.5px solid rgba(80, 170, 255, 0.2);
      background: rgba(255,255,255,0.05);
      color: rgba(160, 210, 255, 0.6);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .joy-btn.active {
      background: rgba(20, 96, 176, 0.45);
      border-color: rgba(80, 170, 255, 0.55);
      color: #ffffff;
    }

    /* Intro blurb */
    .intro-blurb {
      font-size: 13px;
      color: rgba(140, 190, 240, 0.55);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 20px;
      letter-spacing: 0.2px;
    }
    .intro-blurb span {
      color: rgba(180, 220, 255, 0.75);
    }

    /* Footer */
    .landing-footer {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: rgba(80, 130, 180, 0.5);
      text-align: center;
      letter-spacing: 0.3px;
      line-height: 1.6;
    }

    /* ── Game Modal ───────────────────────────────────────────────────────────── */
    #frost-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      align-items: center;
      justify-content: center;
      background: rgba(2, 5, 15, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    #frost-modal.fm-in { opacity: 1; }

    .fm-box {
      background: linear-gradient(155deg, rgba(8, 16, 36, 0.98) 0%, rgba(4, 9, 20, 0.99) 100%);
      border: 1px solid rgba(55, 100, 190, 0.45);
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(80, 140, 255, 0.06) inset,
        0 24px 80px rgba(0, 0, 0, 0.65),
        0 0 50px rgba(20, 70, 180, 0.12);
      width: 420px;
      max-width: calc(100vw - 40px);
      overflow: hidden;
      transform: scale(0.92) translateY(12px);
      transition: transform 0.24s cubic-bezier(0.34, 1.52, 0.64, 1);
    }
    #frost-modal.fm-in .fm-box { transform: scale(1) translateY(0); }

    .fm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px 16px;
      background: rgba(12, 25, 55, 0.7);
      border-bottom: 1px solid rgba(45, 80, 150, 0.35);
    }
    .fm-title {
      font-size: 17px;
      font-weight: 700;
      color: #c0aaff;
      letter-spacing: 0.2px;
    }
    .fm-title.merchant { color: #f0cc60; }
    .fm-title.premium  { color: #88ccff; font-size: 16px; letter-spacing: 0.5px; }

    .fm-xbtn {
      background: none;
      border: none;
      color: rgba(100, 140, 210, 0.45);
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .fm-xbtn:hover {
      color: rgba(180, 210, 255, 0.9);
      background: rgba(60, 100, 200, 0.15);
    }

    .fm-body {
      padding: 20px 24px 8px;
    }
    .fm-line {
      font-size: 14px;
      color: rgba(195, 215, 240, 0.88);
      line-height: 1.65;
      margin: 0 0 2px;
    }
    .fm-line.speech {
      color: rgba(220, 235, 255, 0.95);
      font-style: italic;
    }
    .fm-line.info {
      color: #ffd060;
      font-weight: 600;
    }
    .fm-line.feature {
      color: rgba(140, 195, 255, 0.9);
      padding-left: 2px;
    }
    .fm-line.muted {
      color: rgba(100, 140, 190, 0.55);
      font-size: 12px;
    }
    .fm-sep { height: 10px; }

    .fm-footer {
      padding: 16px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .fm-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.2px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: transform 0.1s, box-shadow 0.18s, background 0.18s;
    }
    .fm-btn:active { transform: scale(0.97); }
    .fm-btn.primary {
      background: linear-gradient(135deg, #1460b0 0%, #0a3a78 100%);
      color: #fff;
      box-shadow: 0 4px 22px rgba(20, 90, 200, 0.38);
    }
    .fm-btn.primary:hover {
      box-shadow: 0 6px 30px rgba(20, 90, 200, 0.55);
      transform: translateY(-1px);
    }
    .fm-btn.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(155, 200, 255, 0.82);
      border: 1px solid rgba(70, 130, 220, 0.2);
    }
    .fm-btn.secondary:hover { background: rgba(255,255,255,0.10); }
  </style>
</head>
<body>

  <!-- Landing page -->
  <div id="landing">
    <div class="landing-content">

      <div class="icon-wrap">
        <div class="spark s1"></div>
        <div class="spark s2"></div>
        <div class="spark s3"></div>
        <div class="spark s4"></div>
        <div class="app-icon">❄</div>
      </div>

      <h1 class="app-title">FROST</h1>
      <p class="app-sub">A Mage's Journey</p>

      <p class="intro-blurb">
        You are an apprentice mage arriving in <span>Millhaven</span>.<br>
        Slay monsters, master spells, and rise to <span>Archmage</span>.
      </p>

      <input
        id="name-input"
        type="text"
        maxlength="16"
        placeholder="Enter your mage name"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />

      <!-- Joystick side — revealed on touch devices -->
      <div class="joy-section" id="joystick-section" style="display:none;">
        <p class="joy-label">Joystick Position</p>
        <div class="joy-toggle">
          <button class="joy-btn active" id="joy-left">◄ Left Hand</button>
          <button class="joy-btn"        id="joy-right">Right Hand ►</button>
        </div>
      </div>

      <button class="btn" id="btn-start">Begin your journey</button>
      <button class="btn" id="btn-guest">Continue as Apprentice</button>

    </div>

    <p class="landing-footer">
      Master fire and frost<br>Rise from apprentice to archmage
    </p>
  </div>

  <!-- Phaser game (injected when journey begins) -->
  <div id="game-container"></div>

  <!-- In-game modal (NPC dialogs, premium gate, etc.) -->
  <div id="frost-modal">
    <div class="fm-box">
      <div class="fm-header">
        <span class="fm-title" id="fm-title"></span>
        <button class="fm-xbtn" id="fm-xbtn">✕</button>
      </div>
      <div class="fm-body" id="fm-body"></div>
      <div class="fm-footer" id="fm-footer"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>

  <script>
    // ── Modal system ─────────────────────────────────────────────────────────
    ;(function () {
      const el     = document.getElementById('frost-modal')
      const box    = el.querySelector('.fm-box')
      const titleEl = document.getElementById('fm-title')
      const bodyEl  = document.getElementById('fm-body')
      const footerEl = document.getElementById('fm-footer')
      const xbtn   = document.getElementById('fm-xbtn')
      let _onClose = null

      function show(cfg) {
        // cfg: { title, lines, buttons:[{label,primary,onClick}], onClose, titleClass }
        titleEl.textContent = cfg.title || ''
        titleEl.className = 'fm-title' + (cfg.titleClass ? ' ' + cfg.titleClass : '')

        bodyEl.innerHTML = ''
        const lines = cfg.lines || []
        let prevEmpty = true   // skip leading empties
        for (let i = 0; i < lines.length; i++) {
          const raw = lines[i]
          if (!raw || raw.startsWith('─')) {
            if (!prevEmpty) {
              const sep = document.createElement('div')
              sep.className = 'fm-sep'
              bodyEl.appendChild(sep)
              prevEmpty = true
            }
            continue
          }
          prevEmpty = false
          const p = document.createElement('p')
          p.className = 'fm-line'
          if (/^["'"']/.test(raw) && /["'"']$/.test(raw)) {
            p.classList.add('speech')
          } else if (/^(Reward|Gold|Progress|Quest):/.test(raw)) {
            p.classList.add('info')
          } else if (/^[◆•]/.test(raw)) {
            p.classList.add('feature')
          } else if (/^You may/.test(raw)) {
            p.classList.add('muted')
          }
          p.textContent = raw
          bodyEl.appendChild(p)
        }

        footerEl.innerHTML = ''
        for (const btn of (cfg.buttons || [])) {
          const b = document.createElement('button')
          b.className = 'fm-btn ' + (btn.primary ? 'primary' : 'secondary')
          b.textContent = btn.label
          b.onclick = () => { hide(); btn.onClick?.() }
          footerEl.appendChild(b)
        }

        _onClose = cfg.onClose || null
        el.style.display = 'flex'
        // double rAF ensures display:flex is applied before transition fires
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('fm-in')))
      }

      function hide() {
        el.classList.remove('fm-in')
        const done = () => {
          el.style.display = 'none'
          el.removeEventListener('transitionend', done)
        }
        el.addEventListener('transitionend', done)
        const cb = _onClose; _onClose = null; cb?.()
      }

      xbtn.addEventListener('click', hide)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && el.classList.contains('fm-in')) hide()
      })

      window.__frostModal = { show, hide }
    })()

    // ── Landing page ─────────────────────────────────────────────────────────
    window.__frostJoystickSide = 'left'

    // Show joystick selector only on touch devices
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      document.getElementById('joystick-section').style.display = 'block'
    }

    document.getElementById('joy-left').addEventListener('click', function () {
      window.__frostJoystickSide = 'left'
      document.getElementById('joy-left').classList.add('active')
      document.getElementById('joy-right').classList.remove('active')
    })
    document.getElementById('joy-right').addEventListener('click', function () {
      window.__frostJoystickSide = 'right'
      document.getElementById('joy-right').classList.add('active')
      document.getElementById('joy-left').classList.remove('active')
    })

    function launchGame(name) {
      const landing = document.getElementById('landing')
      landing.classList.add('fade-out')
      setTimeout(() => { landing.style.display = 'none' }, 650)
      window.__frostPlayerName = name || 'Apprentice'
      window.__frostLaunch && window.__frostLaunch()
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      const raw = document.getElementById('name-input').value.trim()
      launchGame(raw.length > 0 ? raw : 'Apprentice')
    })

    document.getElementById('btn-guest').addEventListener('click', () => {
      launchGame('Apprentice')
    })

    document.getElementById('name-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-start').click()
    })
  </script>
</body>
</html>
