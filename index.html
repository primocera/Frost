<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Frost</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #080e18;
      overflow: hidden;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }
    canvas { display: block; touch-action: none; }

    /* ── Landing page ─────────────────────────────────────────── */
    #landing {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(170deg, #040d1e 0%, #071a3a 28%, #0a2d5e 58%, #0e4a80 82%, #1a6a9a 100%);
      z-index: 100;
      transition: opacity 0.6s ease;
    }
    #landing.fade-out { opacity: 0; pointer-events: none; }

    /* Stars */
    #landing::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 34% 8%,  rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 56% 22%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 12%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 35%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 22% 42%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 66% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 72%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 8%  85%, rgba(255,255,255,0.4) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Content wrapper */
    .landing-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      padding: 0 24px;
      position: relative;
    }

    /* Icon */
    .icon-wrap {
      position: relative;
      margin-bottom: 28px;
    }
    .app-icon {
      width: 108px;
      height: 108px;
      background: linear-gradient(145deg, #1a7fc4 0%, #0d4a8a 60%, #09305e 100%);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      box-shadow:
        0 8px 40px rgba(30, 140, 255, 0.35),
        0 0 80px rgba(30, 140, 255, 0.12),
        inset 0 1px 0 rgba(255,255,255,0.15);
      position: relative;
      z-index: 1;
    }

    /* Sparkle dots */
    .spark {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: sparkle 2.4s ease-in-out infinite;
    }
    .spark.s1 { width: 6px; height: 6px; top: -4px;  right: 14px; animation-delay: 0s; }
    .spark.s2 { width: 4px; height: 4px; top: 14px;  right: -6px; animation-delay: 0.6s; }
    .spark.s3 { width: 5px; height: 5px; bottom: 8px; left: -8px;  animation-delay: 1.2s; }
    .spark.s4 { width: 3px; height: 3px; bottom: -2px; right: 26px; animation-delay: 1.8s; }
    @keyframes sparkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }

    /* Title */
    .app-title {
      font-size: 46px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 10px;
      text-shadow: 0 0 40px rgba(80, 180, 255, 0.7), 0 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 6px;
    }
    .app-sub {
      font-size: 15px;
      color: rgba(160, 210, 255, 0.65);
      letter-spacing: 1px;
      margin-bottom: 44px;
    }

    /* Name input */
    #name-input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(80, 170, 255, 0.25);
      border-radius: 16px;
      color: #ffffff;
      font-size: 17px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.5px;
    }
    #name-input::placeholder { color: rgba(120, 180, 255, 0.4); }
    #name-input:focus {
      border-color: rgba(80, 170, 255, 0.65);
      background: rgba(255, 255, 255, 0.11);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s;
      letter-spacing: 0.3px;
    }
    .btn:active { transform: scale(0.97); }

    #btn-start {
      background: linear-gradient(135deg, #1460b0, #0a3a78);
      color: #ffffff;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(20, 90, 200, 0.4);
    }
    #btn-start:hover {
      box-shadow: 0 6px 28px rgba(20, 90, 200, 0.55);
      transform: translateY(-1px);
    }

    #btn-guest {
      background: rgba(255, 255, 255, 0.07);
      color: rgba(160, 210, 255, 0.85);
      border: 1.5px solid rgba(80, 160, 255, 0.2);
    }
    #btn-guest:hover { background: rgba(255, 255, 255, 0.12); }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      width: 100%;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.3px;
      border: 1.5px solid transparent;
    }
    .mode-btn.normal {
      background: rgba(20, 90, 200, 0.18);
      color: rgba(100, 180, 255, 0.7);
      border-color: rgba(80, 160, 255, 0.2);
    }
    .mode-btn.normal.active {
      background: rgba(20, 90, 200, 0.5);
      color: #88ccff;
      border-color: rgba(80, 160, 255, 0.6);
      box-shadow: 0 0 12px rgba(20, 90, 200, 0.4);
    }
    .mode-btn.hardcore {
      background: rgba(180, 30, 30, 0.12);
      color: rgba(255, 100, 100, 0.5);
      border-color: rgba(200, 50, 50, 0.15);
    }
    .mode-btn.hardcore.active {
      background: rgba(180, 30, 30, 0.45);
      color: #ff7777;
      border-color: rgba(220, 60, 60, 0.6);
      box-shadow: 0 0 12px rgba(180, 30, 30, 0.4);
    }

    /* Intro blurb */
    .intro-blurb {
      font-size: 13px;
      color: rgba(140, 190, 240, 0.55);
      text-align: center;
      line-height: 1.7;
      margin-bottom: 20px;
      letter-spacing: 0.2px;
    }
    .intro-blurb span {
      color: rgba(180, 220, 255, 0.75);
    }

    /* Footer */
    .landing-footer {
      position: absolute;
      bottom: 24px;
      font-size: 11px;
      color: rgba(80, 130, 180, 0.5);
      text-align: center;
      letter-spacing: 0.3px;
      line-height: 1.6;
    }

    /* ── Game Modal ───────────────────────────────────────────────────────────── */
    #frost-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      align-items: center;
      justify-content: center;
      background: rgba(2, 5, 15, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    #frost-modal.fm-in { opacity: 1; }

    .fm-box {
      background: linear-gradient(155deg, rgba(8, 16, 36, 0.98) 0%, rgba(4, 9, 20, 0.99) 100%);
      border: 1px solid rgba(55, 100, 190, 0.45);
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(80, 140, 255, 0.06) inset,
        0 24px 80px rgba(0, 0, 0, 0.65),
        0 0 50px rgba(20, 70, 180, 0.12);
      width: 420px;
      max-width: calc(100vw - 40px);
      overflow: hidden;
      transform: scale(0.92) translateY(12px);
      transition: transform 0.24s cubic-bezier(0.34, 1.52, 0.64, 1);
    }
    #frost-modal.fm-in .fm-box { transform: scale(1) translateY(0); }

    .fm-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px 16px;
      background: rgba(12, 25, 55, 0.7);
      border-bottom: 1px solid rgba(45, 80, 150, 0.35);
    }
    .fm-title {
      font-size: 17px;
      font-weight: 700;
      color: #c0aaff;
      letter-spacing: 0.2px;
    }
    .fm-title.merchant { color: #f0cc60; }
    .fm-title.premium  { color: #88ccff; font-size: 16px; letter-spacing: 0.5px; }

    .fm-xbtn {
      background: none;
      border: none;
      color: rgba(100, 140, 210, 0.45);
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .fm-xbtn:hover {
      color: rgba(180, 210, 255, 0.9);
      background: rgba(60, 100, 200, 0.15);
    }

    .fm-body {
      padding: 20px 24px 8px;
    }
    .fm-line {
      font-size: 14px;
      color: rgba(195, 215, 240, 0.88);
      line-height: 1.65;
      margin: 0 0 2px;
    }
    .fm-line.speech {
      color: rgba(220, 235, 255, 0.95);
      font-style: italic;
    }
    .fm-line.info {
      color: #ffd060;
      font-weight: 600;
    }
    .fm-line.feature {
      color: rgba(140, 195, 255, 0.9);
      padding-left: 2px;
    }
    .fm-line.muted {
      color: rgba(100, 140, 190, 0.55);
      font-size: 12px;
    }
    .fm-sep { height: 10px; }

    .fm-footer {
      padding: 16px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .fm-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.2px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: transform 0.1s, box-shadow 0.18s, background 0.18s;
    }
    .fm-btn:active { transform: scale(0.97); }
    .fm-btn.primary {
      background: linear-gradient(135deg, #1460b0 0%, #0a3a78 100%);
      color: #fff;
      box-shadow: 0 4px 22px rgba(20, 90, 200, 0.38);
    }
    .fm-btn.primary:hover {
      box-shadow: 0 6px 30px rgba(20, 90, 200, 0.55);
      transform: translateY(-1px);
    }
    .fm-btn.secondary {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(155, 200, 255, 0.82);
      border: 1px solid rgba(70, 130, 220, 0.2);
    }
    .fm-btn.secondary:hover { background: rgba(255,255,255,0.10); }

    /* ── Game Panels (large interactive panels) ──────────────────────────────── */
    .gp-backdrop {
      position: fixed; inset: 0; z-index: 400;
      display: flex; align-items: center; justify-content: center;
      background: rgba(2, 5, 15, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .gp-backdrop.gp-in { opacity: 1; pointer-events: all; }

    .gp-panel {
      background: linear-gradient(155deg, rgba(8,16,36,0.98) 0%, rgba(4,9,20,0.99) 100%);
      border: 1px solid rgba(55,100,190,0.4);
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.65), 0 0 50px rgba(20,70,180,0.1);
      display: flex; flex-direction: column;
      overflow: hidden;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      transform: scale(0.93) translateY(10px);
      transition: transform 0.22s cubic-bezier(0.34,1.52,0.64,1);
    }
    .gp-backdrop.gp-in .gp-panel { transform: scale(1) translateY(0); }

    .gp-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 20px 11px;
      background: rgba(12,25,55,0.7);
      border-bottom: 1px solid rgba(45,80,150,0.35);
      flex-shrink: 0;
    }
    .gp-title { font-size: 15px; font-weight: 700; color: #c0aaff; letter-spacing: 0.3px; }
    .gp-close {
      background: none; border: none; color: rgba(100,140,210,0.45);
      font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
      transition: color 0.15s, background 0.15s; font-family: inherit;
    }
    .gp-close:hover { color: rgba(180,210,255,0.9); background: rgba(60,100,200,0.15); }

    /* Shared item slot */
    .gp-slot {
      background: rgba(17,17,24,1);
      border: 1px solid rgba(34,34,51,0.7);
      border-radius: 4px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; position: relative;
      font-size: 10px; text-align: center;
      overflow: hidden; transition: filter 0.1s;
      user-select: none;
    }
    .gp-slot:hover { filter: brightness(1.22); }
    .gp-slot.common { border-color: rgba(85,85,85,0.65); background: rgba(26,24,24,1); }
    .gp-slot.magic  { border-color: rgba(68,119,255,0.65); background: rgba(13,22,40,1); }
    .gp-slot.rare   { border-color: rgba(221,187,0,0.65); background: rgba(28,24,0,1); }
    .gp-slot.epic   { border-color: rgba(187,51,255,0.65); background: rgba(24,13,40,1); }
    .gp-slot .item-type { font-size: 13px; font-weight: 700; line-height: 1; }
    .gp-slot .item-name { font-size: 9px; line-height: 1.2; padding: 0 2px; }
    .gp-slot.common .item-type,.gp-slot.common .item-name { color: #aaaaaa; }
    .gp-slot.magic  .item-type,.gp-slot.magic  .item-name { color: #5599ff; }
    .gp-slot.rare   .item-type,.gp-slot.rare   .item-name { color: #ffdd00; }
    .gp-slot.epic   .item-type,.gp-slot.epic   .item-name { color: #cc44ff; }

    /* Tooltip */
    #gp-tooltip {
      position: fixed; z-index: 600; pointer-events: none;
      background: rgba(5,5,16,0.97);
      border-radius: 7px; padding: 10px 13px;
      font-size: 11px; line-height: 1.65; color: #dddddd;
      white-space: pre; display: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ── Inventory ─────────────────────────────────────────────────────────────── */
    .gp-inv-body { display: flex; flex: 1; min-height: 0; }
    .gp-equip-col {
      width: 210px; padding: 10px 8px;
      border-right: 1px solid rgba(51,68,85,0.45);
      display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;
    }
    .gp-equip-slot {
      background: rgba(15,15,22,1);
      border: 1px solid rgba(34,34,51,0.85);
      border-radius: 5px; padding: 7px 10px;
      cursor: pointer; transition: background 0.12s;
    }
    .gp-equip-slot:hover { background: rgba(22,22,36,1); }
    .gp-equip-label { font-size: 10px; color: #446688; text-transform: uppercase; letter-spacing: 0.5px; }
    .gp-equip-name { font-size: 11px; color: #444455; margin-top: 2px; }
    .gp-equip-name.common { color: #aaaaaa; }
    .gp-equip-name.magic  { color: #5599ff; }
    .gp-equip-name.rare   { color: #ffdd00; }
    .gp-equip-name.epic   { color: #cc44ff; }
    .gp-equip-name.has-rarity-bar { border-left: 3px solid; padding-left: 6px; }
    .gp-equip-name.has-rarity-bar.common { border-left-color: #888; }
    .gp-equip-name.has-rarity-bar.magic  { border-left-color: #4477ff; }
    .gp-equip-name.has-rarity-bar.rare   { border-left-color: #ddbb00; }
    .gp-equip-name.has-rarity-bar.epic   { border-left-color: #bb33ff; }

    .gp-grid-col { flex: 1; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .gp-item-grid {
      display: grid;
      grid-template-columns: repeat(5, 56px);
      gap: 6px;
    }
    .gp-item-grid .gp-slot { width: 56px; height: 56px; }
    .gp-gold-row { font-size: 12px; color: #ffdd00; padding: 2px 0; }

    /* ── Talents ──────────────────────────────────────────────────────────────── */
    .gp-talent-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .gp-tree-col {
      flex: 1; display: flex; flex-direction: column;
      border-right: 1px solid rgba(51,68,85,0.35);
      overflow-y: auto; position: relative;
    }
    .gp-tree-col:last-child { border-right: none; }
    .gp-tree-col::-webkit-scrollbar { width: 4px; }
    .gp-tree-col::-webkit-scrollbar-thumb { background: rgba(60,90,130,0.4); border-radius: 2px; }

    .gp-tree-header {
      padding: 10px 12px 8px; text-align: center;
      font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(51,68,85,0.35);
      flex-shrink: 0;
    }
    .gp-tree-col.tree-frost .gp-tree-header  { color: #44aaff; background: rgba(68,170,255,0.07); border-bottom-color: rgba(68,170,255,0.25); }
    .gp-tree-col.tree-fire   .gp-tree-header  { color: #ff6633; background: rgba(255,102,51,0.07); border-bottom-color: rgba(255,102,51,0.25); }
    .gp-tree-col.tree-arcane .gp-tree-header  { color: #cc44ff; background: rgba(204,68,255,0.07); border-bottom-color: rgba(204,68,255,0.25); }

    .gp-talent-row {
      padding: 9px 12px 7px 15px;
      border-bottom: 1px solid rgba(25,30,45,0.9);
      border-left: 3px solid transparent; position: relative;
    }
    .gp-talent-row.has-rank.tree-frost  { border-left-color: rgba(68,170,255,0.7); background: rgba(68,170,255,0.04); }
    .gp-talent-row.has-rank.tree-fire   { border-left-color: rgba(255,102,51,0.7); background: rgba(255,102,51,0.04); }
    .gp-talent-row.has-rank.tree-arcane { border-left-color: rgba(204,68,255,0.7); background: rgba(204,68,255,0.04); }
    .gp-talent-name { font-size: 12px; font-weight: 600; margin-bottom: 3px; }
    .gp-tree-col.tree-frost  .gp-talent-name { color: #44aaff; }
    .gp-tree-col.tree-fire   .gp-talent-name { color: #ff6633; }
    .gp-tree-col.tree-arcane .gp-talent-name { color: #cc44ff; }
    .gp-tree-col.locked-tree .gp-talent-name { color: #334444 !important; }
    .gp-rank-dots { font-size: 14px; letter-spacing: 3px; margin-bottom: 2px; }
    .gp-tree-col.tree-frost  .gp-rank-dots .filled { color: #44aaff; }
    .gp-tree-col.tree-fire   .gp-rank-dots .filled { color: #ff6633; }
    .gp-tree-col.tree-arcane .gp-rank-dots .filled { color: #cc44ff; }
    .gp-rank-dots .empty { color: #334455; }
    .gp-tree-col.locked-tree .gp-rank-dots .filled { color: #334444 !important; }
    .gp-talent-desc { font-size: 10px; color: #778899; margin-bottom: 5px; }
    .gp-tree-col.locked-tree .gp-talent-desc { color: #223333 !important; }
    .gp-buy-btn {
      font-size: 11px; padding: 3px 10px;
      border-radius: 4px; cursor: pointer;
      font-family: inherit; transition: filter 0.12s;
      background: rgba(10,30,20,0.9);
      border: 1px solid rgba(34,102,51,0.5); color: #44ff88;
    }
    .gp-tree-col.tree-frost  .gp-buy-btn { border-color: rgba(68,170,255,0.4); color: #44aaff; background: rgba(10,20,40,0.9); }
    .gp-tree-col.tree-fire   .gp-buy-btn { border-color: rgba(255,102,51,0.4); color: #ff6633; background: rgba(40,15,10,0.9); }
    .gp-tree-col.tree-arcane .gp-buy-btn { border-color: rgba(204,68,255,0.4); color: #cc44ff; background: rgba(30,10,40,0.9); }
    .gp-buy-btn:hover:not(:disabled) { filter: brightness(1.3); }
    .gp-buy-btn:disabled { color: #334433; border-color: rgba(34,34,34,0.4); cursor: default; background: rgba(10,10,10,0.7); }
    .gp-lock-overlay {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      font-size: 12px; color: #334455; text-align: center; line-height: 1.6;
    }
    .gp-talent-footer {
      padding: 7px 16px; border-top: 1px solid rgba(51,68,85,0.35);
      font-size: 12px; color: #ffdd88; text-align: center; flex-shrink: 0;
    }

    /* ── Stash ────────────────────────────────────────────────────────────────── */
    .gp-stash-body { display: flex; flex: 1; min-height: 0; }
    .gp-stash-half {
      flex: 1; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .gp-stash-half:first-child { border-right: 1px solid rgba(51,68,85,0.4); }
    .gp-stash-label {
      font-size: 10px; font-weight: 700; text-align: center;
      text-transform: uppercase; letter-spacing: 0.7px;
      padding: 5px 8px; border-radius: 4px; color: #778899;
    }
    .gp-stash-half:first-child .gp-stash-label { background: rgba(26,42,26,0.5); }
    .gp-stash-half:last-child  .gp-stash-label { background: rgba(26,26,42,0.5); }
    .gp-stash-grid {
      display: grid;
      grid-template-columns: repeat(5, 56px);
      gap: 6px;
    }
    .gp-stash-grid .gp-slot { width: 56px; height: 56px; }

    /* ── Progression ──────────────────────────────────────────────────────────── */
    .gp-prog-tabs {
      display: flex; border-bottom: 1px solid rgba(51,68,85,0.35); flex-shrink: 0;
    }
    .gp-prog-tab {
      flex: 1; padding: 10px 8px; text-align: center;
      font-size: 12px; font-weight: 600; color: #445566; cursor: pointer;
      border-bottom: 2px solid transparent; transition: color 0.15s, background 0.15s;
    }
    .gp-prog-tab:hover:not(.active) { color: #778899; }
    .gp-prog-tab.active { color: #aabbcc; border-bottom-color: rgba(100,160,220,0.6); }
    .gp-prog-tab.active[data-tab="0"] { background: rgba(26,42,26,0.3); }
    .gp-prog-tab.active[data-tab="1"] { background: rgba(26,26,42,0.3); }
    .gp-prog-tab.active[data-tab="2"] { background: rgba(42,26,42,0.3); }
    .gp-prog-content { flex: 1; overflow-y: auto; padding: 12px 16px; min-height: 0; }
    .gp-prog-content::-webkit-scrollbar { width: 4px; }
    .gp-prog-content::-webkit-scrollbar-thumb { background: rgba(60,90,130,0.4); border-radius: 2px; }

    .gp-ch-card {
      background: rgba(12,18,30,0.9); border: 1px solid rgba(45,70,110,0.45);
      border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
    }
    .gp-ch-card.done { border-color: rgba(34,102,51,0.5); background: rgba(10,22,12,0.9); }
    .gp-ch-title { font-size: 13px; color: #ccddee; margin-bottom: 4px; }
    .gp-ch-card.done .gp-ch-title { color: #44ff88; }
    .gp-ch-sub { font-size: 11px; color: #778899; margin-bottom: 7px; }
    .gp-prog-bar { height: 5px; background: rgba(51,68,85,0.5); border-radius: 3px; overflow: hidden; margin-bottom: 7px; }
    .gp-prog-fill { height: 100%; background: #3366cc; border-radius: 3px; }
    .gp-prog-fill.done { background: #33aa55; }
    .gp-ch-reward { font-size: 12px; color: #ffdd88; }
    .gp-ch-card.done .gp-ch-reward { color: #aa8833; }

    .gp-ach-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 4px; border-bottom: 1px solid rgba(25,30,45,0.6);
    }
    .gp-ach-icon {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; background: rgba(51,68,85,0.4);
    }
    .gp-ach-icon.done { background: rgba(34,100,60,0.5); }
    .gp-ach-body { flex: 1; min-width: 0; }
    .gp-ach-name { font-size: 12px; color: #778899; }
    .gp-ach-name.done { color: #66dd88; }
    .gp-ach-desc { font-size: 10px; color: #445566; margin-top: 1px; }
    .gp-ach-right { font-size: 11px; color: #445566; text-align: right; flex-shrink: 0; }
    .gp-ach-right.done { color: #336644; }
    .gp-ach-bar { width: 120px; height: 4px; background: rgba(51,68,85,0.5); border-radius: 2px; overflow: hidden; margin-top: 4px; }
    .gp-ach-fill { height: 100%; background: #334488; border-radius: 2px; }

    .gp-cos-strip {
      display: flex; gap: 10px; flex-wrap: wrap;
      background: rgba(12,14,24,0.8); border: 1px solid rgba(34,51,68,0.4);
      border-radius: 8px; padding: 12px; margin-bottom: 14px;
    }
    .gp-cos-card {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 8px 10px; border-radius: 7px; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.15s, background 0.15s;
      min-width: 80px;
    }
    .gp-cos-card:hover { background: rgba(255,255,255,0.04); }
    .gp-cos-card.equipped { border-color: rgba(100,180,255,0.5); background: rgba(20,40,80,0.4); }
    .gp-cos-card.locked { opacity: 0.45; cursor: default; }
    .gp-cos-dot { width: 36px; height: 36px; border-radius: 50%; }
    .gp-cos-name { font-size: 11px; color: #aabbcc; }
    .gp-cos-card.locked .gp-cos-name { color: #334455; }
    .gp-cos-hint { font-size: 9px; color: #334455; text-align: center; }

    .gp-stats-header { font-size: 10px; color: #334455; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; }
    .gp-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .gp-stat-card {
      background: rgba(12,18,30,0.7); border: 1px solid rgba(34,51,68,0.4);
      border-radius: 6px; padding: 10px 12px;
    }
    .gp-stat-label { font-size: 10px; color: #446677; text-transform: uppercase; letter-spacing: 0.4px; }
    .gp-stat-val { font-size: 22px; font-weight: 700; color: #7799bb; margin-top: 2px; }
    .gp-prog-footer {
      padding: 7px 16px; border-top: 1px solid rgba(51,68,85,0.35);
      font-size: 10px; color: #334455; text-align: center; flex-shrink: 0;
    }

    /* ── Panel size classes (overridden by media query on mobile) ─────────────── */
    .gp-panel-inv    { width: 660px; }
    .gp-panel-talent { width: 820px; height: 520px; }
    .gp-panel-stash  { width: 680px; }
    .gp-panel-prog   { width: 860px; height: 540px; }
    .gp-panel-shop   { width: 720px; max-height: 600px; }

    /* ── Shop ─────────────────────────────────────────────────────────────────── */
    .gp-shop-body { flex: 1; overflow-y: auto; padding: 12px 16px; min-height: 0; }
    .gp-shop-body::-webkit-scrollbar { width: 4px; }
    .gp-shop-body::-webkit-scrollbar-thumb { background: rgba(60,90,130,0.4); border-radius: 2px; }
    .gp-shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px,1fr));
      gap: 10px;
    }
    .gp-shop-card {
      background: rgba(12,18,30,0.9); border: 1px solid rgba(45,70,110,0.4);
      border-radius: 8px; padding: 11px 10px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .gp-shop-card.common { border-color: rgba(85,85,85,0.45); }
    .gp-shop-card.magic  { border-color: rgba(68,119,255,0.45); }
    .gp-shop-card.rare   { border-color: rgba(221,187,0,0.45); }
    .gp-shop-card.epic   { border-color: rgba(187,51,255,0.45); }
    .gp-shop-name { font-size: 12px; font-weight: 600; }
    .gp-shop-name.common { color: #aaaaaa; }
    .gp-shop-name.magic  { color: #5599ff; }
    .gp-shop-name.rare   { color: #ffdd00; }
    .gp-shop-name.epic   { color: #cc44ff; }
    .gp-shop-stats { font-size: 10px; color: #667788; line-height: 1.6; }
    .gp-shop-row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .gp-shop-price { font-size: 12px; color: #ffdd00; font-weight: 600; }
    .gp-shop-buy-btn {
      font-size: 11px; padding: 4px 11px;
      background: linear-gradient(135deg,rgba(20,80,160,0.8),rgba(10,50,100,0.8));
      border: 1px solid rgba(60,120,220,0.45); border-radius: 5px;
      color: #88bbff; cursor: pointer; font-family: inherit;
      transition: filter 0.12s;
    }
    .gp-shop-buy-btn:hover:not(:disabled) { filter: brightness(1.3); }
    .gp-shop-buy-btn:disabled { color: #334455; border-color: rgba(34,34,51,0.4); cursor: default; filter: none; background: rgba(12,12,20,0.6); }
    .gp-shop-gold-bar {
      padding: 8px 18px; border-top: 1px solid rgba(51,68,85,0.35);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .gp-shop-gold-label { font-size: 11px; color: #445566; }
    .gp-shop-gold-val { font-size: 14px; color: #ffdd00; font-weight: 700; }
    /* ── Mobile responsive panels ──────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .gp-backdrop { align-items: flex-end; padding-bottom: 0; }

      .gp-panel {
        border-radius: 16px 16px 0 0;
        max-height: 92vh;
      }
      .gp-panel-inv,
      .gp-panel-talent,
      .gp-panel-stash,
      .gp-panel-prog,
      .gp-panel-shop {
        width: 100vw !important;
        height: auto;
        max-height: 92vh;
      }
      .gp-panel-talent,
      .gp-panel-prog { height: 88vh; }

      .gp-header { padding: 10px 14px 9px; }
      .gp-title  { font-size: 14px; }

      /* Inventory: equip slots wrap horizontally on top, grid below */
      .gp-inv-body   { flex-direction: column; }
      .gp-equip-col  {
        width: 100%; border-right: none;
        border-bottom: 1px solid rgba(51,68,85,0.4);
        flex-direction: row; flex-wrap: wrap; gap: 4px; padding: 8px 10px;
      }
      .gp-equip-slot { flex: 1 1 calc(50% - 2px); min-width: 130px; padding: 6px 8px; }
      .gp-grid-col   { padding: 10px; }
      .gp-item-grid  {
        grid-template-columns: repeat(5, 1fr);
        gap: 5px; width: 100%;
      }
      .gp-item-grid .gp-slot { width: auto; height: 52px; }

      /* Talents: columns scroll horizontally */
      .gp-talent-body {
        overflow-x: auto; overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        flex-shrink: 1;
      }
      .gp-tree-col { min-width: 200px; flex-shrink: 0; }
      .gp-talent-footer { font-size: 11px; padding: 6px 12px; }

      /* Stash: halves stack vertically */
      .gp-stash-body { flex-direction: column; overflow-y: auto; }
      .gp-stash-half { padding: 8px 10px; }
      .gp-stash-half:first-child {
        border-right: none;
        border-bottom: 1px solid rgba(51,68,85,0.4);
      }
      .gp-stash-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 5px; width: 100%;
      }
      .gp-stash-grid .gp-slot { width: auto; height: 52px; }

      /* Progression: already tab-based, tweak padding */
      .gp-prog-content { padding: 10px 12px; }
      .gp-prog-tab { font-size: 11px; padding: 8px 4px; }
      .gp-stats-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
      .gp-stat-val { font-size: 18px; }
      .gp-cos-strip { gap: 6px; }
      .gp-cos-card { min-width: 64px; padding: 6px 6px; }

      /* Shop: 2 columns */
      .gp-shop-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .gp-shop-body { padding: 10px 12px; }
    }

    /* Slide-up animation on mobile */
    @media (max-width: 640px) {
      .gp-panel {
        transform: translateY(40px);
        transition: transform 0.24s cubic-bezier(0.34,1.4,0.64,1);
      }
      .gp-backdrop.gp-in .gp-panel { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Landing page -->
  <div id="landing">
    <div class="landing-content">

      <div class="icon-wrap">
        <div class="spark s1"></div>
        <div class="spark s2"></div>
        <div class="spark s3"></div>
        <div class="spark s4"></div>
        <div class="app-icon">❄</div>
      </div>

      <h1 class="app-title">FROST</h1>
      <p class="app-sub">A Mage's Journey</p>

      <p class="intro-blurb">
        You are an apprentice mage arriving in <span>Millhaven</span>.<br>
        Slay monsters, master spells, and rise to <span>Archmage</span>.
      </p>

      <input
        id="name-input"
        type="text"
        maxlength="16"
        placeholder="Enter your mage name"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />

      <div class="mode-toggle">
        <button class="mode-btn normal active" id="btn-normal">⚡ Normal</button>
        <button class="mode-btn hardcore"      id="btn-hardcore">☠ Hardcore</button>
      </div>

      <button class="btn" id="btn-start">Begin your journey</button>
      <button class="btn" id="btn-guest">Continue as Apprentice</button>

    </div>

    <p class="landing-footer">
      Master fire and frost<br>Rise from apprentice to archmage
    </p>
  </div>

  <!-- Phaser game (injected when journey begins) -->
  <div id="game-container"></div>

  <!-- Shared tooltip for game panels -->
  <div id="gp-tooltip"></div>

  <!-- In-game modal (NPC dialogs, premium gate, etc.) -->
  <div id="frost-modal">
    <div class="fm-box">
      <div class="fm-header">
        <span class="fm-title" id="fm-title"></span>
        <button class="fm-xbtn" id="fm-xbtn">✕</button>
      </div>
      <div class="fm-body" id="fm-body"></div>
      <div class="fm-footer" id="fm-footer"></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>

  <script>
    // ── Modal system ─────────────────────────────────────────────────────────
    ;(function () {
      const el     = document.getElementById('frost-modal')
      const box    = el.querySelector('.fm-box')
      const titleEl = document.getElementById('fm-title')
      const bodyEl  = document.getElementById('fm-body')
      const footerEl = document.getElementById('fm-footer')
      const xbtn   = document.getElementById('fm-xbtn')
      let _onClose = null

      function show(cfg) {
        // cfg: { title, lines, buttons:[{label,primary,onClick}], onClose, titleClass }
        titleEl.textContent = cfg.title || ''
        titleEl.className = 'fm-title' + (cfg.titleClass ? ' ' + cfg.titleClass : '')

        bodyEl.innerHTML = ''
        const lines = cfg.lines || []
        let prevEmpty = true   // skip leading empties
        for (let i = 0; i < lines.length; i++) {
          const raw = lines[i]
          if (!raw || raw.startsWith('─')) {
            if (!prevEmpty) {
              const sep = document.createElement('div')
              sep.className = 'fm-sep'
              bodyEl.appendChild(sep)
              prevEmpty = true
            }
            continue
          }
          prevEmpty = false
          const p = document.createElement('p')
          p.className = 'fm-line'
          if (/^["'"']/.test(raw) && /["'"']$/.test(raw)) {
            p.classList.add('speech')
          } else if (/^(Reward|Gold|Progress|Quest):/.test(raw)) {
            p.classList.add('info')
          } else if (/^[◆•]/.test(raw)) {
            p.classList.add('feature')
          } else if (/^You may/.test(raw)) {
            p.classList.add('muted')
          }
          p.textContent = raw
          bodyEl.appendChild(p)
        }

        footerEl.innerHTML = ''
        for (const btn of (cfg.buttons || [])) {
          const b = document.createElement('button')
          b.className = 'fm-btn ' + (btn.primary ? 'primary' : 'secondary')
          b.textContent = btn.label
          b.onclick = () => { hide(); btn.onClick?.() }
          footerEl.appendChild(b)
        }

        _onClose = cfg.onClose || null
        el.style.display = 'flex'
        // double rAF ensures display:flex is applied before transition fires
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('fm-in')))
      }

      function hide() {
        el.classList.remove('fm-in')
        const done = () => {
          el.style.display = 'none'
          el.removeEventListener('transitionend', done)
        }
        el.addEventListener('transitionend', done)
        const cb = _onClose; _onClose = null; cb?.()
      }

      xbtn.addEventListener('click', hide)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && el.classList.contains('fm-in')) hide()
      })

      window.__frostModal = { show, hide }
    })()

    // ── Game panel utilities ──────────────────────────────────────────────────
    ;(function () {
      const tip = document.getElementById('gp-tooltip')
      let _tipTarget = null

      window.__gpTooltip = {
        show(html, x, y, borderColor) {
          tip.innerHTML = html
          tip.style.borderLeft = borderColor ? `3px solid ${borderColor}` : ''
          tip.style.paddingLeft = borderColor ? '10px' : '13px'
          // keep on screen
          tip.style.display = 'block'
          const tw = tip.offsetWidth, th = tip.offsetHeight
          const px = x + 16 + tw > window.innerWidth  ? x - tw - 10 : x + 16
          const py = Math.min(y, window.innerHeight - th - 10)
          tip.style.left = px + 'px'
          tip.style.top  = py + 'px'
        },
        hide() { tip.style.display = 'none' },
      }

      // Panel open/close animation helper
      window.__gpPanel = {
        open(backdrop) {
          backdrop.style.display = 'flex'
          requestAnimationFrame(() => requestAnimationFrame(() => backdrop.classList.add('gp-in')))
        },
        close(backdrop) {
          backdrop.classList.remove('gp-in')
          const done = () => { backdrop.style.display = 'none'; backdrop.removeEventListener('transitionend', done) }
          backdrop.addEventListener('transitionend', done)
        },
      }
    })()

    // ── Landing page ─────────────────────────────────────────────────────────
    let hardcoreMode = false

    document.getElementById('btn-normal').addEventListener('click', () => {
      hardcoreMode = false
      document.getElementById('btn-normal').classList.add('active')
      document.getElementById('btn-hardcore').classList.remove('active')
    })
    document.getElementById('btn-hardcore').addEventListener('click', () => {
      hardcoreMode = true
      document.getElementById('btn-hardcore').classList.add('active')
      document.getElementById('btn-normal').classList.remove('active')
    })

    function launchGame(name) {
      const landing = document.getElementById('landing')
      landing.classList.add('fade-out')
      setTimeout(() => { landing.style.display = 'none' }, 650)
      window.__frostPlayerName = name || 'Apprentice'
      window.__frostHardcore   = hardcoreMode
      window.__frostLaunch && window.__frostLaunch()
    }

    document.getElementById('btn-start').addEventListener('click', () => {
      const raw = document.getElementById('name-input').value.trim()
      launchGame(raw.length > 0 ? raw : 'Apprentice')
    })

    document.getElementById('btn-guest').addEventListener('click', () => {
      launchGame('Apprentice')
    })

    document.getElementById('name-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-start').click()
    })
  </script>
</body>
</html>
